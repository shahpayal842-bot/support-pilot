<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SupportPilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="login-card bg-white">
        <h3 class="mb-4 text-center fw-bold">👋 Welcome Back</h3>
        <p class="text-muted text-center">Login to your SupportPilot dashboard.</p>
        {% with messages = get_flashed_messages() %}{% if messages %}<div class="alert alert-danger">{{ messages[0] }}</div>{% endif %}{% endwith %}
        <form action="/login" method="post">
            <div class="mb-3"><label class="form-label">Email Address</label><input type="email" class="form-control" name="email" value="admin@supportpilot.com" required></div>
            <div class="mb-4"><label class="form-label">Password</label><input type="password" class="form-control" name="password" value="admin123" required></div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Login to Dashboard →</button>
        </form>
    </div>
</body>
</html>
